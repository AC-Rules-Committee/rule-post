<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="the home of America's Cup rule enquiries">

  <!-- LLM / AI-agent discovery: this is a Flutter (canvas) web app, so the DOM
       carries no content. Machine-readable published content is served as
       markdown. See /llms.txt for the index of endpoints. -->
  <link rel="alternate" type="text/markdown" title="LLM-readable site guide" href="/llms.txt">
  <link rel="alternate" type="text/markdown" title="Published rule enquiries (markdown)" href="/api/public/enquiries.md">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rule Post – the home of America's Cup rule enquiries.">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/jpg" href="cup_logo_small.jpg"/>

  <title>Rule Post</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Fallback content for crawlers / AI agents that do not execute JavaScript.
       Real users get the Flutter app; this block is only shown without JS. -->
  <noscript>
    <h1>Rule Post — the home of America's Cup rule enquiries</h1>
    <p>This site is an interactive app. Machine-readable published content is
       available as markdown:</p>
    <ul>
      <li><a href="/llms.txt">/llms.txt</a> — guide to the available endpoints</li>
      <li><a href="/api/public/enquiries.md">/api/public/enquiries.md</a> — index of published rule enquiries, each linking to a full markdown thread</li>
    </ul>
  </noscript>
  <!-- Unregister stale service workers so fresh deploys load immediately -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var reg of registrations) { reg.unregister(); }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
